area</text></g><g><g transform="translate(250 250) scale(1.25)"><path d="M0 0V17.5L4.4 13.3L7.3 20L10.1 18.8L7.3 12.3H13.2Z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></g><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.36;0.42;0.47;0.52;0.86;0.92;0.97;1" values="0 0;0 0;372 26;352 22;352 22;352 22;-20 -4;0 0;0 0" calcMode="spline" keySplines=".3 0 .25 1;.3 0 .25 1;.3 0 .25 1;.3 0 .25 1;.3 0 .25 1;.3 0 .25 1;.3 0 .25 1;.3 0 .25 1"/></g>
</g>
