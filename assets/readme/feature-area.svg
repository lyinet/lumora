  <rect x="360.5" y="168.5" width="351" height="245" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</g>
  <rect x="40" y="40" width="720" height="420" fill="#000" fill-opacity=".42"/>
