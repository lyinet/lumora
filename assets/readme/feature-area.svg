<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Area capture with window snapping</title>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17181F"/><stop offset="1" stop-color="#0C0D12"/></linearGradient>
  <radialGradient id="glow" cx="210" cy="120" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A84FF" stop-opacity=".28"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18234A"/><stop offset=".55" stop-color="#2A1A4F"/><stop offset="1" stop-color="#3A1B3E"/></linearGradient>
  <radialGradient id="wpb" cx="140" cy="420" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A84FF" stop-opacity=".45"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
  <clipPath id="desk"><rect x="40" y="40" width="720" height="420" rx="16"/></clipPath>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>

  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2B1E6B"/><stop offset=".38" stop-color="#83409E"/><stop offset=".7" stop-color="#FF6F61"/><stop offset="1" stop-color="#FFB86B"/>
  </linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#FFD29A" stop-opacity=".8"/><stop offset="1" stop-color="#FFB36B" stop-opacity="0"/></radialGradient>
  <symbol id="sunset" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="260" fill="url(#sky)"/>
    <circle cx="250" cy="170" r="110" fill="url(#sunGlow)"/>
    <circle cx="250" cy="170" r="42" fill="#FFE2B0"/>
    <path d="M0 190L60 150L110 172L170 126L230 170L290 138L350 166L400 144V260H0Z" fill="#7A3F93"/>
    <path d="M0 214L70 178L130 204L200 168L262 210L330 184L400 212V260H0Z" fill="#2A1B4D"/>
  </symbol>

</defs>
<rect width="800" height="500" rx="28" fill="url(#card)"/>
<rect width="800" height="500" rx="28" fill="url(#glow)"/>
<g clip-path="url(#desk)">
  <rect x="40" y="40" width="720" height="420" fill="url(#wp)"/>
  <rect x="40" y="40" width="720" height="420" fill="url(#wpb)"/>
  <g>
  <rect x="92" y="106" width="340" height="250" rx="12" fill="#000" opacity=".45" filter="url(#sh)"/>
