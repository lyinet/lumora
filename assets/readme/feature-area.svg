  <rect x="92.5" y="96.5" width="339" height="249" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</g><g>
  <rect x="360" y="178" width="352" height="246" rx="12" fill="#000" opacity=".45" filter="url(#sh)"/>
  <rect x="360" y="168" width="352" height="246" rx="12" fill="#1E1F26"/>
  <path d="M360 202V180a12 12 0 0 1 12-12h328a12 12 0 0 1 12 12v22Z" fill="#272830"/>
