[workspace]
resolver = "2"
members = ["crates/lumora-core", "crates/lumora-capture", "crates/lumora-ui", "apps/lumora"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/lumora-app/lumora"
authors = ["Lumora contributors"]

[workspace.dependencies]
lumora-core = { path = "crates/lumora-core" }
lumora-capture = { path = "crates/lumora-capture" }
lumora-ui = { path = "crates/lumora-ui" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
log = "0.4"

objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-image-io = "0.3"
objc2-service-management = "0.3"
objc2-uniform-type-identifiers = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
