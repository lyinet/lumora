name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test platform-independent crates
        run: cargo test --locked -p lumora-core -p lumora-ui -p lumora-capture -p lumora-ai

  macos:
    name: macOS (fmt, clippy, test, universal .app)
    runs-on: macos-15
    env:
      # Developer ID signing switches on only when all three certificate
      # secrets exist (forks and PRs from forks never see secrets, so they
      # keep the ad-hoc build). These are booleans, never secret values;
      # the secrets themselves are mapped only into the signing step.
      SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      SIGNING_SECRETS_PARTIAL: ${{ (secrets.MACOS_CERT_P12 != '' || secrets.MACOS_CERT_PASSWORD != '' || secrets.APPLE_TEAM_ID != '') && !(secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (arm64)
        run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: clippy (x86_64)
        run: cargo clippy --locked --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: test
        run: cargo test --locked --workspace
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build universal app + DMG (ad-hoc signed)
        if: env.SIGNING_ENABLED != 'true'
        run: scripts/sign-and-notarize.sh
      - name: Build universal app + DMG (Developer ID signed + notarized)
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          # Tag builds must be notarized; branch / PR builds may ship
          # signed-only when no notary credentials are configured.
          REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: scripts/sign-and-notarize.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-dmg
          path: dist/*.dmg
          if-no-files-found: error
